name: ExamCraft checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: runner.os == 'Windows'
        run: npm run test:e2e
      - if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: test-results/
          retention-days: 7
